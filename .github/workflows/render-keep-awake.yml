name: Keep Render awake

# Wakes/keeps the Render deployment alive. The app self-pings while it is
# running (KEEP_ALIVE=true in render.yaml), but after a spin-down or a fresh
# deploy something external must send the first request — this cron does that.
# The repository is public, so Actions minutes are free and unlimited.
#
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions
# -> Variables -> add RENDER_PING_URL with the full health URL, e.g.
#   https://<your-service>.onrender.com/api/health
#
# Notes:
# - GitHub can delay scheduled runs by a few minutes at peak times; the
#   10-minute cadence absorbs typical delays (worst case: one cold start).
# - GitHub disables scheduled workflows after 60 days of repository
#   inactivity; re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          PING_URL: ${{ vars.RENDER_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "RENDER_PING_URL repository variable is not set - nothing to do."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          # A cold instance can take ~a minute to answer; allow generous time.
          curl --silent --show-error --max-time 150 --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$PING_URL"
